<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Down for Maintenance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border-top: 5px solid #0070f3; /* Accent line color */
        }
        h1 {
            font-size: 24px;
            color: #111111;
            margin-bottom: 15px;
        }
        p {
            font-size: 16px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .badge {
            display: inline-block;
            background-color: #eef6ff;
            color: #0070f3;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div style="margin-bottom: 20px;">
            <span class="badge">Scheduled Maintenance</span>
        </div>
        <h1>We’ll be right back!</h1>
        <p>Our website is temporarily down while we perform system upgrades and server fixes. We apologize for the inconvenience and expect to be back online shortly.</p>
    </div>

</body>
</html>
